<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Healthline Ruby-Red Gradient -->
    <linearGradient id="favBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="45%" stop-color="#d82424" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Squircle Rounded Badge Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#favBadge)" />
  <rect x="4" y="4" width="56" height="26" rx="13" fill="url(#gloss)" />

  <!-- Steam Curves -->
  <path d="M26 16 C24 12, 28 10, 27 6" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.85" />
  <path d="M32 15 C30 10, 35 9, 33 4.5" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" />
  <path d="M38 16 C36 12, 40 10, 39 6" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.85" />

  <!-- Pot Lid Handle -->
  <ellipse cx="32" cy="19" rx="4.5" ry="2.5" fill="#ffffff" />
  <rect x="30" y="20.5" width="4" height="2.5" rx="1" fill="#fecdd3" />

  <!-- Pot Lid -->
  <path d="M17 27 C17 23.5, 23 21.5, 32 21.5 C41 21.5, 47 23.5, 47 27 Z" fill="#ffffff" opacity="0.95" />

  <!-- Pot Body -->
  <path d="M16 28.5 C16 28.5, 17.5 43, 19.5 46 C21.5 48.5, 25.5 50, 32 50 C38.5 50, 42.5 48.5, 44.5 46 C46.5 43, 48 28.5, 48 28.5 Z" fill="#ffffff" />

  <!-- Inner Soup / Simmer Layer -->
  <ellipse cx="32" cy="30" rx="12" ry="2.5" fill="#ffe4e6" />

  <!-- Pot Side Handles -->
  <path d="M16 31 C12.5 31, 12.5 37, 16 37" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" />
  <path d="M48 31 C51.5 31, 51.5 37, 48 37" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" />

  <!-- Center Accent Heart / Ember Dot -->
  <circle cx="32" cy="38" r="2.2" fill="#d82424" />
</svg>
